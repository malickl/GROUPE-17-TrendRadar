<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de tendances</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #8a897f;
    --line: #e1e0d9; --axis: #c3c2b7;
    --good: #0ca30c; --bad: #d03b3b; --on-fill: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e86;
      --line: #2c2c2a; --axis: #383835; --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #8f8e86;
    --line: #2c2c2a; --axis: #383835; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--ink-2); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 4px 24px 12px; }
  .controls label { color: var(--ink-2); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
                   border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--ink-2); }
  .legend { display: flex; gap: 16px; margin-left: auto; color: var(--ink-2); flex-wrap: wrap; }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  main { display: grid; grid-template-columns: 1fr 1fr 340px; gap: 16px; padding: 0 24px 24px; }
  .panel, aside { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .panel { padding: 14px 16px; min-height: 520px; display: flex; flex-direction: column; }
  .panel h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .panel .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chart { flex: 1; position: relative; min-height: 440px; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  circle.bubble { cursor: pointer; stroke: var(--surface); stroke-width: 2px; transition: opacity .15s; }
  circle.bubble.excluded { fill-opacity: .18; stroke-width: 1.5px; stroke-dasharray: 3 3; }
  circle.bubble.selected { stroke: var(--ink); stroke-width: 3px; }
  circle.bubble:hover { opacity: .85; }
  text.blabel { fill: var(--on-fill); font-size: 11px; font-weight: 600; pointer-events: none; text-anchor: middle; }
  text.blabel.dim { fill: var(--ink); }
  aside { padding: 18px; align-self: start; position: sticky; top: 16px; }
  aside .empty { color: var(--muted); }
  aside h3 { margin: 0 0 4px; font-size: 18px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; padding: 2px 10px;
           border-radius: 999px; color: var(--on-fill); font-size: 13px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 14px 0; }
  .kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .warn { color: var(--ink-2); font-size: 12px; border-left: 3px solid var(--axis); padding-left: 8px; margin: 8px 0; }
  .reasons { padding-left: 18px; margin: 6px 0 12px; color: var(--ink-2); }
  .spark { width: 100%; height: 110px; }
  .spark path.l { fill: none; stroke: var(--ink-2); stroke-width: 2px; }
  .spark line.t0 { stroke: var(--axis); stroke-dasharray: 3 3; }
  .spark text { fill: var(--muted); font-size: 10px; }
  a { color: var(--ink); }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--page); padding: 6px 10px;
         border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .1s; z-index: 10; max-width: 240px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-2); font-weight: 600; }
  #tableView { display: none; grid-column: 1 / 3; }
  #tableView .panel { min-height: 0; overflow: auto; }
  .error { margin: 24px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; padding: 0 16px 16px; }
    header, .controls { padding-left: 16px; padding-right: 16px; } #tableView { grid-column: 1; }
    aside { position: static; } .panel { min-height: 420px; } .chart { min-height: 360px; } }
</style>
</head>
<body>
<header>
  <h1>Radar de tendances</h1>
  <span class="sub" id="meta">Chargement…</span>
</header>
<div class="controls">
  <label>Groupe <select id="group"><option value="">Tous</option></select></label>
  <label><input type="checkbox" id="showExcl"> Afficher les cas exclus (pointillés)</label>
  <button id="toggleTable" aria-pressed="false">Vue tableau</button>
  <div class="legend">
    <span><i class="dot" style="background:var(--good)"></i>▲ Tendance durable</span>
    <span><i class="dot" style="background:var(--bad)"></i>▼ Buzz</span>
    <span>Taille = confiance du modèle</span>
  </div>
</div>
<main>
  <section class="panel" id="pTrend">
    <h2><i class="dot" style="background:var(--good)"></i>▲ Tendance durable <span class="sub" id="nTrend"></span></h2>
    <div class="hint">Encore là dans 2 ans, selon le modèle</div>
    <div class="chart" id="cTrend"></div>
  </section>
  <section class="panel" id="pBuzz">
    <h2><i class="dot" style="background:var(--bad)"></i>▼ Buzz <span class="sub" id="nBuzz"></span></h2>
    <div class="hint">Retombera, selon le modèle</div>
    <div class="chart" id="cBuzz"></div>
  </section>
  <div id="tableView"><div class="panel"><table id="tbl"></table></div></div>
  <aside id="detail"><p class="empty">Clique sur une bulle pour voir le signal.</p></aside>
</main>
<div id="tip"></div>

<script>
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fmtMonth = m => m ? `${MOIS[+m.slice(4) - 1]} ${m.slice(0, 4)}` : '–';
const addMonths = (m, n) => { const i = +m.slice(0, 4) * 12 + (+m.slice(4) - 1) + n;
                              return `${Math.floor(i / 12)}${String(i % 12 + 1).padStart(2, '0')}`; };
const pct = x =>`${Math.round(x * 100)} %`;
const num = (x, d = 1) => (+x).toLocaleString('fr-FR', { maximumFractionDigits: d });
const isTrend = s => s.label === 'Tendance durable';
const conf = s => isTrend(s) ? s.proba_tendance : 1 - s.proba_tendance;   // confiance dans son propre verdict
const color = s => isTrend(s) ? 'var(--good)' : 'var(--bad)';
const wiki = t => `https://en.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g, '_'))}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let DATA = [], selected = null;
const tip = document.getElementById('tip');

// Rayon : confiance 50 % -> petit, 100 % -> grand (échelle sur le diamètre, comme demandé)
const R_MIN = 6, R_MAX = 44;
const radius = s => R_MIN + (R_MAX - R_MIN) * Math.max(0, (conf(s) - 0.5) / 0.5);

function visible() {
  const g = document.getElementById('group').value;
  const ex = document.getElementById('showExcl').checked;
  return DATA.filter(s => (!g || s.group === g) && (ex || s.exclu_raison === null));
}

function layout(items) {
  const circles = items.map(s => ({ s, r: radius(s) }))
                       .sort((a, b) => b.r - a.r);
  d3.packSiblings(circles);
  const enc = circles.length ? d3.packEnclose(circles) : { x: 0, y: 0, r: 1 };
  return { circles, enc };
}

function draw() {
  const items = visible();
  const trend = items.filter(isTrend), buzz = items.filter(s => !isTrend(s));
  document.getElementById('nTrend').textContent = `(${trend.length})`;
  document.getElementById('nBuzz').textContent = `(${buzz.length})`;
  const L = [layout(trend), layout(buzz)];
  const els = [document.getElementById('cTrend'), document.getElementById('cBuzz')];
  // Même échelle pour les deux panneaux : une bulle à 90 % a la même taille à gauche et à droite
  const k = Math.min(...els.map((el, i) => {
    const { width, height } = el.getBoundingClientRect();
    return Math.min(width, height) / (2 * L[i].enc.r + 8);
  }), 1.6);
  els.forEach((el, i) => drawPanel(el, L[i], k));
  drawTable(items);
}

function drawPanel(el, { circles, enc }, k) {
  const { width, height } = el.getBoundingClientRect();
  const svg = d3.select(el).selectAll('svg').data([0]).join('svg');
  const g = svg.selectAll('g.root').data([0]).join('g').attr('class', 'root')
    .attr('transform', `translate(${width / 2},${height / 2}) scale(${k}) translate(${-enc.x},${-enc.y})`);
  const node = g.selectAll('g.n').data(circles, d => d.s.title).join(
    enter => {
      const n = enter.append('g').attr('class', 'n');
      n.append('circle').attr('class', 'bubble').attr('r', 0);
      n.append('text').attr('class', 'blabel').attr('dy', '.35em');
      return n;
    });
  node.attr('transform', d => `translate(${d.x},${d.y})`);
  node.select('circle')
    .attr('fill', d => color(d.s))
    .classed('excluded', d => d.s.exclu_raison !== null)
    .classed('selected', d => selected && d.s.title === selected.title)
    .attr('role', 'button').attr('tabindex', 0)
    .attr('aria-label', d => `${d.s.title}, ${d.s.label}, confiance ${pct(conf(d.s))}`)
    .on('mousemove', (e, d) => {
      tip.innerHTML = `<b>${esc(d.s.title)}</b><br>${esc(d.s.label)} · confiance ${pct(conf(d.s))}`;
      tip.style.left = `${e.clientX + 14}px`; tip.style.top = `${e.clientY + 14}px`; tip.style.opacity = 1;
    })
    .on('mouseleave', () => { tip.style.opacity = 0; })
    .on('click', (e, d) => select(d.s))
    .on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(d.s); } })
    .transition().duration(400).attr('r', d => d.r);
  // Étiquette directe seulement dans les grosses bulles
  node.select('text')
    .classed('dim', d => d.s.exclu_raison !== null)
    .style('font-size', `${11 / k}px`)
    .text(d => {
      const maxChars = Math.floor((d.r * k * 2 - 8) / 6.5);
      if (d.r * k < 26 || maxChars < 4) return '';
      return d.s.title.length > maxChars ? d.s.title.slice(0, maxChars - 1) + '…' : d.s.title;
    });
}

function drawTable(items) {
  const rows = [...items].sort((a, b) => conf(b) - conf(a));
  document.getElementById('tbl').innerHTML =
    '<thead><tr><th>Signal</th><th>Groupe</th><th>Verdict</th><th>Confiance</th><th>Décollage</th><th>Exclu</th></tr></thead><tbody>' +
    rows.map(s => `<tr><td><a href="#" data-t="${esc(s.title)}">${esc(s.title)}</a></td><td>${esc(s.group)}</td>
      <td>${isTrend(s) ? '▲' : '▼'} ${esc(s.label)}</td><td>${pct(conf(s))}</td><td>${fmtMonth(s.t0)}</td>
      <td>${s.exclu_raison ? esc(s.exclu_raison) : ''}</td></tr>`).join('') + '</tbody>';
}
document.getElementById('tbl').addEventListener('click', e => {
  const t = e.target.closest('a[data-t]'); if (!t) return;
  e.preventDefault(); select(DATA.find(s => s.title === t.dataset.t));
});

function select(s) {
  selected = s;
  d3.selectAll('circle.bubble').classed('selected', d => d.s.title === s.title);
  const col = color(s);
  document.getElementById('detail').innerHTML = `
    <h3>${esc(s.title)}</h3>
    <span class="badge" style="background:${col}">${isTrend(s) ? '▲' : '▼'} ${esc(s.label)}</span>
    <span class="sub">&nbsp;confiance ${pct(conf(s))}</span>
    ${s.exclu_raison ? `<p class="warn">Cas exclu par les garde-fous : ${esc(s.exclu_raison)}.</p>` : ''}
    <dl class="kv">
      <dt>Groupe</dt><dd>${esc(s.group)}</dd>
      <dt>Décollage</dt><dd>${fmtMonth(s.t0)}</dd>
      <dt>Proba tendance</dt><dd>${pct(s.proba_tendance)}</dd>
      <dt>Vérifiable en</dt><dd>${fmtMonth(String(s.verdict_verifiable_le))}</dd>
    </dl>
    <ul class="reasons">
      <li>Depuis le décollage : ${s.growth_since_t0 >= 1 ? 'encore en hausse' : 'en baisse'} (x${num(s.growth_since_t0)})</li>
      <li>Pic : ${num(s.max_ratio)} fois l'ancien record</li>
      <li>Courbe ${s.volatility >= 0.5 ? 'très irrégulière' : s.volatility >= 0.3 ? 'irrégulière' : 'régulière'} (volatilité ${num(s.volatility, 2)})</li>
    </ul>
    <div id="spark" class="sub">Chargement de la courbe…</div>
    <p><a href="${wiki(s.title)}" target="_blank" rel="noopener">Voir la page Wikipédia ↗</a></p>`;
  loadCurve(s);
}

async function loadCurve(s) {
  const box = document.getElementById('spark');
  try {
    const r = await fetch('/predict', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ title: s.title, group: s.group }) });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    if (selected !== s) return;
    const months = j.series.months, views = j.series.views;
    const i0 = Math.max(0, months.indexOf(s.t0) - 24);
    const M = months.slice(i0), V = views.slice(i0), it0 = M.indexOf(s.t0);
    const W = box.clientWidth || 300, H = 110, P = 4;
    const x = d3.scaleLinear([0, M.length - 1], [P, W - P]);
    const y = d3.scaleLinear([0, d3.max(V) || 1], [H - 16, P]);
    const line = d3.line((v, i) => x(i), v => y(v));
    box.innerHTML = `<div class="sub" style="margin-bottom:4px">Vues mensuelles (Wikipédia anglais)</div>
      <svg class="spark" viewBox="0 0 ${W} ${H}">
        ${it0 >= 0 ? `<line class="t0" x1="${x(it0)}" x2="${x(it0)}" y1="${P}" y2="${H - 16}"></line>
        <text x="${x(it0) + 4}" y="${P + 8}">décollage</text>` : ''}
        <path class="l" d="${line(V)}"></path>
        <text x="${P}" y="${H - 3}">${fmtMonth(M[0])}</text>
        <text x="${W - P}" y="${H - 3}" text-anchor="end">${fmtMonth(M[M.length - 1])}</text>
      </svg>`;
  } catch (e) {
    if (selected === s) box.textContent = 'Courbe indisponible (Wikipédia ne répond pas).';
  }
}

async function init() {
  try {
    const r = await fetch('/scan/latest');
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const j = await r.json();
    DATA = j.rows;
    const valid = DATA.filter(s => s.exclu_raison === null);
    document.getElementById('meta').textContent =
      `${valid.length} signaux valides · décollages de ${fmtMonth(addMonths(j.last_month, -12))} à ${fmtMonth(addMonths(j.last_month, -4))} · données à fin ${fmtMonth(j.last_month)}`;
    const groups = [...new Set(DATA.map(s => s.group))].sort((a, b) => a.localeCompare(b, 'fr'));
    document.getElementById('group').innerHTML += groups.map(g => `<option>${esc(g)}</option>`).join('');
    draw();
  } catch (e) {
    document.querySelector('main').innerHTML =
      `<div class="error">Impossible de charger le scan : ${esc(e.message)}.<br>L'API est-elle lancée (<code>uvicorn src.api:app</code>) ?</div>`;
  }
}

document.getElementById('group').addEventListener('change', draw);
document.getElementById('showExcl').addEventListener('change', draw);
document.getElementById('toggleTable').addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', on);
  document.getElementById('tableView').style.display = on ? 'block' : 'none';
  document.getElementById('pTrend').style.display = on ? 'none' : '';
  document.getElementById('pBuzz').style.display = on ? 'none' : '';
  if (!on) draw();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 150); });
init();
</script>
</body>
</html>
